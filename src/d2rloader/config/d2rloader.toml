# Darkest Diablo's own D2RLoader settings. They override the player's global ones while the mod
# is active. tools/build.py copies this folder into the mod.

[d2rcore.stash]
# The camp's stash: extra shared pages after the game's own 3, 14 in all (the last 4 are for ascended heroes, docs/ascend.md). Every hero of a save sees
